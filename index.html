<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملعب الألعاب</title>
<style>
:root{
  --paper:#f6f1e6; --ink:#22201c; --line:#3a362f;
  --acc1:#b5482f; --acc2:#2f5f4f; --acc3:#7a5c3e; --muted:#8a8172;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#1c1a16; --ink:#f2ede0; --line:#e7e0cf; --acc1:#e0704f; --acc2:#5fa78d; --acc3:#c9a876;}
}
:root[data-theme="dark"]{--paper:#1c1a16; --ink:#f2ede0; --line:#e7e0cf; --acc1:#e0704f; --acc2:#5fa78d; --acc3:#c9a876;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;min-height:100%;}
header{padding:28px 16px 10px;text-align:center;}
header h1{margin:0 0 4px;font-size:clamp(26px,6vw,36px);}
header p{margin:0;color:var(--muted);font-size:14px;}
#home{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:640px;margin:24px auto;padding:0 16px 40px;}
.tile{background:transparent;border:2px solid var(--line);border-radius:10px;padding:22px 10px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;transition:transform .12s ease;}
.tile:hover{transform:translateY(-2px);}
.tile .emoji{display:block;font-size:30px;margin-bottom:8px;}
.game{max-width:480px;margin:0 auto;padding:10px 16px 40px;text-align:center;display:none;}
.game.active{display:block;}
.back{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:14px;}
.status{margin:18px 0;font-size:17px;min-height:26px;}
button.reset{margin-top:18px;padding:9px 20px;background:var(--ink);color:var(--paper);border:none;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}

/* X-O */
#xoBoard{display:grid;grid-template-columns:repeat(3,minmax(64px,84px));grid-template-rows:repeat(3,minmax(64px,84px));gap:5px;background:var(--line);padding:5px;border-radius:8px;justify-content:center;margin:0 auto;}
.cell{background:var(--paper);border:none;border-radius:4px;font-size:32px;font-weight:700;cursor:pointer;color:var(--ink);}
.cell.x{color:var(--acc1);} .cell.o{color:var(--acc2);}

/* RPS */
.rps-choices{display:flex;gap:12px;justify-content:center;margin-top:8px;}
.rps-choices button{font-size:34px;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:14px 18px;cursor:pointer;}
.rps-result{display:flex;justify-content:center;gap:40px;margin-top:18px;font-size:40px;}

/* Guess */
#guessInput{font-size:18px;padding:8px 12px;border-radius:6px;border:2px solid var(--line);width:100px;text-align:center;background:var(--paper);color:var(--ink);font-family:inherit;}
#guessGo{font-size:16px;padding:9px 16px;border-radius:6px;border:none;background:var(--acc3);color:var(--paper);cursor:pointer;margin-inline-start:8px;font-family:inherit;}

/* Memory */
#memBoard{display:grid;grid-template-columns:repeat(4,minmax(56px,68px));gap:6px;justify-content:center;margin:0 auto;}
.mcard{aspect-ratio:1;background:var(--acc3);border-radius:6px;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--paper);}
.mcard.flipped{background:var(--paper);border:2px solid var(--line);color:var(--ink);}
.mcard.matched{background:transparent;border:2px solid var(--acc2);color:var(--acc2);opacity:.6;}

/* Snake */
#snakeCanvas{background:var(--line);border-radius:8px;touch-action:none;}
.snake-controls{display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center;margin-top:14px;}
.snake-controls button{font-size:20px;padding:8px;border-radius:6px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>ملعب الألعاب</h1>
  <p>اختار لعبة وابدأ</p>
</header>

<div id="home">
  <button class="tile" data-game="xo"><span class="emoji">❌</span>إكس أوه</button>
  <button class="tile" data-game="rps"><span class="emoji">✊</span>حجر ورقة مقص</button>
  <button class="tile" data-game="guess"><span class="emoji">🔢</span>خمن الرقم</button>
  <button class="tile" data-game="memory"><span class="emoji">🧠</span>الذاكرة</button>
  <button class="tile" data-game="snake"><span class="emoji">🐍</span>أفعى</button>
</div>

<!-- X-O -->
<section class="game" id="game-xo">
  <button class="back">← رجوع</button>
  <div id="xoBoard"></div>
  <p class="status" id="xoStatus"></p>
  <button class="reset" id="xoReset">جولة جديدة</button>
</section>

<!-- RPS -->
<section class="game" id="game-rps">
  <button class="back">← رجوع</button>
  <p class="status">اختار حجر ولا ورقة ولا مقص</p>
  <div class="rps-choices">
    <button data-c="✊">✊</button>
    <button data-c="✋">✋</button>
    <button data-c="✌️">✌️</button>
  </div>
  <div class="rps-result" id="rpsResult"></div>
  <p class="status" id="rpsStatus"></p>
</section>

<!-- Guess -->
<section class="game" id="game-guess">
  <button class="back">← رجوع</button>
  <p class="status">فكرت في رقم من 1 لـ 50، حاول تخمنه</p>
  <div><input type="number" id="guessInput" min="1" max="50"><button id="guessGo">جرّب</button></div>
  <p class="status" id="guessStatus"></p>
  <button class="reset" id="guessReset">لعبة جديدة</button>
</section>

<!-- Memory -->
<section class="game" id="game-memory">
  <button class="back">← رجوع</button>
  <p class="status" id="memStatus">لاقي كل الأزواج</p>
  <div id="memBoard"></div>
  <button class="reset" id="memReset">لعبة جديدة</button>
</section>

<!-- Snake -->
<section class="game" id="game-snake">
  <button class="back">← رجوع</button>
  <p class="status" id="snakeStatus">النقاط: 0</p>
  <canvas id="snakeCanvas" width="240" height="240"></canvas>
  <div class="snake-controls">
    <span></span><button id="snUp">↑</button><span></span>
    <button id="snLeft">←</button><button id="snDown">↓</button><button id="snRight">→</button>
  </div>
</section>

<script>
// ---------- Navigation ----------
const home = document.getElementById('home');
document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>showGame(t.dataset.game)));
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',showHome));
function showGame(id){
  home.style.display='none';
  document.querySelectorAll('.game').forEach(g=>g.classList.remove('active'));
  document.getElementById('game-'+id).classList.add('active');
  if(id==='snake') startSnake();
}
function showHome(){
  home.style.display='grid';
  document.querySelectorAll('.game').forEach(g=>g.classList.remove('active'));
  stopSnake();
}

// ---------- X-O ----------
(function(){
  const boardEl=document.getElementById('xoBoard'), statusEl=document.getElementById('xoStatus');
  let cells=Array(9).fill(null), turn='X', active=true;
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function build(){
    boardEl.innerHTML='';
    cells.forEach((v,i)=>{
      const b=document.createElement('button');
      b.className='cell';
      b.addEventListener('click',()=>play(i));
      boardEl.appendChild(b);
    });
    render();
  }
  function render(){
    [...boardEl.children].forEach((b,i)=>{
      b.textContent=cells[i]||'';
      b.className='cell'+(cells[i]==='X'?' x':cells[i]==='O'?' o':'');
      b.disabled=!!cells[i]||!active;
    });
    if(active) statusEl.textContent='دور اللاعب '+turn;
  }
  function winner(){
    for(const [a,b,c] of wins) if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c]) return cells[a];
    if(cells.every(c=>c)) return 'D';
    return null;
  }
  function play(i){
    if(cells[i]||!active) return;
    cells[i]=turn;
    const w=winner();
    if(w){active=false; statusEl.textContent = w==='D' ? 'تعادل!' : 'فاز اللاعب '+w+' 🎉'; render(); return;}
    turn=turn==='X'?'O':'X'; render();
  }
  document.getElementById('xoReset').addEventListener('click',()=>{cells=Array(9).fill(null);turn='X';active=true;build();});
  build();
})();

// ---------- RPS ----------
(function(){
  const opts=['✊','✋','✌️'];
  const beats={'✊':'✌️','✋':'✊','✌️':'✋'};
  const resEl=document.getElementById('rpsResult'), statEl=document.getElementById('rpsStatus');
  document.querySelectorAll('.rps-choices button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const me=btn.dataset.c, cpu=opts[Math.floor(Math.random()*3)];
      resEl.textContent=me+'  مقابل  '+cpu;
      let msg;
      if(me===cpu) msg='تعادل!';
      else if(beats[me]===cpu) msg='كسبت! 🎉';
      else msg='خسرت 😅';
      statEl.textContent=msg;
    });
  });
})();

// ---------- Guess ----------
(function(){
  let target=Math.ceil(Math.random()*50), tries=0;
  const input=document.getElementById('guessInput'), statusEl=document.getElementById('guessStatus');
  document.getElementById('guessGo').addEventListener('click',()=>{
    const v=Number(input.value);
    if(!v) return;
    tries++;
    if(v===target) statusEl.textContent='صح! الرقم كان '+target+' 🎉 (عدد محاولاتك: '+tries+')';
    else if(v<target) statusEl.textContent='أكبر من كده ⬆️';
    else statusEl.textContent='أصغر من كده ⬇️';
  });
  document.getElementById('guessReset').addEventListener('click',()=>{
    target=Math.ceil(Math.random()*50); tries=0; input.value=''; statusEl.textContent='';
  });
})();

// ---------- Memory ----------
(function(){
  const icons=['🍎','🍌','🍇','🍉','🍒','🍋','🍑','🥝'];
  const boardEl=document.getElementById('memBoard'), statusEl=document.getElementById('memStatus');
  let cards=[], flipped=[], matched=0, lock=false;
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function build(){
    cards=shuffle([...icons,...icons]);
    flipped=[]; matched=0; lock=false;
    statusEl.textContent='لاقي كل الأزواج';
    boardEl.innerHTML='';
    cards.forEach((icon,i)=>{
      const c=document.createElement('div');
      c.className='mcard'; c.dataset.i=i;
      c.addEventListener('click',()=>flip(i,c));
      boardEl.appendChild(c);
    });
  }
  function flip(i,el){
    if(lock||el.classList.contains('flipped')||el.classList.contains('matched')) return;
    el.textContent=cards[i]; el.classList.add('flipped');
    flipped.push({i,el});
    if(flipped.length===2){
      lock=true;
      const [a,b]=flipped;
      if(cards[a.i]===cards[b.i]){
        a.el.classList.add('matched'); b.el.classList.add('matched');
        matched++; flipped=[]; lock=false;
        if(matched===icons.length) statusEl.textContent='برافو! خلصت اللعبة 🎉';
      } else {
        setTimeout(()=>{
          a.el.textContent=''; b.el.textContent='';
          a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
          flipped=[]; lock=false;
        },700);
      }
    }
  }
  document.getElementById('memReset').addEventListener('click',build);
  build();
})();

// ---------- Snake ----------
let snakeTimer=null;
(function(){
  const canvas=document.getElementById('snakeCanvas'), ctx=canvas.getContext('2d');
  const size=12, cols=20, rows=20;
  let snake, dir, food, score, gameOver;
  function reset(){
    snake=[{x:10,y:10}]; dir={x:1,y:0}; score=0; gameOver=false;
    placeFood();
    document.getElementById('snakeStatus').textContent='النقاط: 0';
  }
  function placeFood(){
    food={x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)};
  }
  function tick(){
    if(gameOver) return;
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver=true;
      document.getElementById('snakeStatus').textContent='خسرت! النقاط: '+score+' — اضغط زرار عشان تلعب تاني';
      draw();
      return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score++; placeFood(); document.getElementById('snakeStatus').textContent='النقاط: '+score; }
    else snake.pop();
    draw();
  }
  function draw(){
    const css=getComputedStyle(document.documentElement);
    ctx.fillStyle=css.getPropertyValue('--line'); ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle=css.getPropertyValue('--acc1');
    ctx.fillRect(food.x*size, food.y*size, size-1, size-1);
    ctx.fillStyle=css.getPropertyValue('--acc2');
    snake.forEach(s=>ctx.fillRect(s.x*size, s.y*size, size-1, size-1));
  }
  function setDir(x,y){ if(dir.x===-x&&dir.y===-y) return; dir={x,y}; }
  document.getElementById('snUp').addEventListener('click',()=>setDir(0,-1));
  document.getElementById('snDown').addEventListener('click',()=>setDir(0,1));
  document.getElementById('snLeft').addEventListener('click',()=>setDir(-1,0));
  document.getElementById('snRight').addEventListener('click',()=>setDir(1,0));
  document.getElementById('game-snake').addEventListener('click',(e)=>{ if(gameOver && e.target.tagName!=='BUTTON'){ reset(); draw(); } });
  document.addEventListener('keydown',(e)=>{
    if(!document.getElementById('game-snake').classList.contains('active')) return;
    if(e.key==='ArrowUp') setDir(0,-1);
    if(e.key==='ArrowDown') setDir(0,1);
    if(e.key==='ArrowLeft') setDir(-1,0);
    if(e.key==='ArrowRight') setDir(1,0);
  });
  window.startSnake=function(){
    reset(); draw();
    if(snakeTimer) clearInterval(snakeTimer);
    snakeTimer=setInterval(tick,180);
  };
  window.stopSnake=function(){
    if(snakeTimer){clearInterval(snakeTimer); snakeTimer=null;}
  };
})();
</script>
</body>
</html>
