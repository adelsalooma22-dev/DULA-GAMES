<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>🎮 DULA Games - عالم الألعاب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== الشريط العلوي ===== -->
<div class="topbar">
  <div class="chip"><small>المستوى</small><span id="topLevel">1</span> ⭐</div>
  <div class="chip"><small>الخبرة</small><span id="topXP">0</span></div>
  <div class="chip"><small>العملات</small><span id="topCoins">0</span> 🪙</div>
  <div class="chip"><small>السلسلة</small><span id="topStreak">0</span> 🔥</div>
</div>

<!-- ===== الهيرو ===== -->
<section class="hero">
  <h1>🎮 DULA Games</h1>
  <p>العب، اجمع الكوينز، وارتقِ في لوحة المتصدرين!</p>
  <div class="hero-actions">
    <button class="btn-primary" onclick="openAdventure()">🗺️ ابدأ المغامرة</button>
    <button class="btn-ghost" onclick="claimDaily()">🎁 تحدي اليوم</button>
    <button class="btn-ghost" onclick="openShop()">🛒 المتجر</button>
  </div>
</section>

<!-- ===== الشاشة الرئيسية ===== -->
<main id="homeScreen">

  <!-- لوحة المتصدرين -->
  <section class="leaderboard">
    <h2>🏆 أفضل 5 لاعبين</h2>
    <ol id="leaderboardList"></ol>
  </section>

  <!-- البحث -->
  <div class="search-box">
    <input id="gameSearch" type="search" placeholder="🔎 ابحث عن لعبة..." oninput="filterGames(this.value)">
  </div>

  <!-- الألعاب -->
  <section class="games-grid" id="gamesGrid"></section>

</main>

<!-- ===== شاشة اللعبة ===== -->
<main id="gameScreen" style="display:none">
  <div class="game-header">
    <button class="back-btn" onclick="backHome()">⬅ رجوع</button>
    <h2 id="gameTitle"></h2>
    <div class="score-display">💯 <span id="currentScore">0</span></div>
  </div>
  <div id="gameArea"></div>
</main>

<!-- ===== شاشة المتجر ===== -->
<div id="shopModal" class="modal">
  <div class="modal-content">
    <div class="modal-head">
      <h2>🛒 المتجر</h2>
      <button onclick="closeShop()">✖</button>
    </div>
    <p class="shop-coins">رصيدك: <b><span id="shopCoins">0</span></b> 🪙</p>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<!-- ===== إشعار ===== -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
